# Optional GPU services: the plate reader (anpr-service/) and the people/vehicle/face detector (inference-service/, not yet run on a GPU).
# Apply with `kubectl apply -f deploy/k8s/optional/gpu-services.yaml` after the base, and set ANPR_SERVICE_URL / INFERENCE_SERVICE_URL in omnisee-config.
# Needs nodes with NVIDIA GPUs and the NVIDIA device plugin; adjust the node selector and toleration to how your GPU nodes are labelled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnisee-anpr
  namespace: omnisee
  labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: anpr, app.kubernetes.io/part-of: omnisee }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: anpr }
  template:
    metadata:
      labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: anpr, app.kubernetes.io/part-of: omnisee }
    spec:
      nodeSelector: { accelerator: nvidia }
      tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: anpr
          image: omnisee-anpr-gpu
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          env: [{ name: ANPR_DEVICE, value: cuda }]
          envFrom: [{ secretRef: { name: omnisee-anpr-secrets } }]   # ANPR_API_KEY
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: 1 }
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 30, failureThreshold: 4 }
---
apiVersion: v1
kind: Service
metadata:
  name: omnisee-anpr
  namespace: omnisee
spec:
  selector: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: anpr }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnisee-inference
  namespace: omnisee
  labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: inference, app.kubernetes.io/part-of: omnisee }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: inference }
  template:
    metadata:
      labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: inference, app.kubernetes.io/part-of: omnisee }
    spec:
      nodeSelector: { accelerator: nvidia }
      tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: inference
          image: omnisee-inference-gpu
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8100 }]
          env:
            - { name: INFERENCE_DEVICE, value: "cuda:0" }
            - { name: INFERENCE_FACES, value: "off" }
          envFrom: [{ secretRef: { name: omnisee-inference-secrets } }]   # INFERENCE_API_KEY
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: 1 }
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 30, failureThreshold: 4 }
---
apiVersion: v1
kind: Service
metadata:
  name: omnisee-inference
  namespace: omnisee
spec:
  selector: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: inference }
  ports: [{ name: http, port: 8100, targetPort: http }]
---
# Only the application pods may call the GPU services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gpu-from-app, namespace: omnisee }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [anpr, inference] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [web, scheduler, worker] }
      ports: [{ protocol: TCP, port: 8000 }, { protocol: TCP, port: 8100 }]
---
# ...and the app pods must be allowed to call them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: app-to-gpu, namespace: omnisee }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [web, scheduler, worker] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [anpr, inference] }
      ports: [{ protocol: TCP, port: 8000 }, { protocol: TCP, port: 8100 }]
