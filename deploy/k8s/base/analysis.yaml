# Analysis: one scheduler decides what is due, N workers capture frames and call the models. They share a queue in Redis (docs/scale-out.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnisee-scheduler
  namespace: omnisee
  labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: scheduler, app.kubernetes.io/part-of: omnisee }
spec:
  replicas: 1                       # exactly one: two schedulers would queue every camera twice
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: scheduler }
  template:
    metadata:
      labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: scheduler, app.kubernetes.io/part-of: omnisee }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: scheduler
          image: omnisee-app
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: SERVER_ANALYSIS, value: "true" }
            - { name: ANALYSIS_ROLE, value: scheduler }
          envFrom:
            - configMapRef: { name: omnisee-config }
            - secretRef: { name: omnisee-secrets }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 4 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: omnisee-data }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnisee-worker
  namespace: omnisee
  labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: worker, app.kubernetes.io/part-of: omnisee }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: worker, app.kubernetes.io/part-of: omnisee }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: omnisee-app
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: SERVER_ANALYSIS, value: "true" }
            - { name: ANALYSIS_ROLE, value: worker }
          envFrom:
            - configMapRef: { name: omnisee-config }
            - secretRef: { name: omnisee-secrets }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          # A worker's cost is ffmpeg frame grabs and model calls: CPU and a little memory per concurrent job.
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 4 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: omnisee-data }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omnisee-worker
  namespace: omnisee
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: omnisee-worker }
  minReplicas: 2
  maxReplicas: 40
  behavior:
    scaleDown: { stabilizationWindowSeconds: 600 }   # do not flap: cameras come in waves
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
