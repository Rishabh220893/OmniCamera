# The web tier: the API and the React app. Stateless apart from /data (small files: sealed sources, walls, clients) which is a volume shared by the pods that
# write it; for more than one replica use a ReadWriteMany volume, or move those files to the database (see docs/deployment-modes.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnisee-web
  namespace: omnisee
  labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: web, app.kubernetes.io/part-of: omnisee }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: web, app.kubernetes.io/part-of: omnisee }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: omnisee-app
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: SERVER_ANALYSIS, value: "false" }   # analysis runs in the scheduler and worker pods
          envFrom:
            - configMapRef: { name: omnisee-config }
            - secretRef: { name: omnisee-secrets }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1536Mi }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 4 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: omnisee-data }
---
apiVersion: v1
kind: Service
metadata:
  name: omnisee-web
  namespace: omnisee
  labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: web }
spec:
  selector: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnisee-data
  namespace: omnisee
spec:
  accessModes: [ReadWriteMany]   # needs a storage class that supports it (NFS, CephFS, EFS, Azure Files); with one replica ReadWriteOnce is enough
  resources: { requests: { storage: 5Gi } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omnisee-web
  namespace: omnisee
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: omnisee-web }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omnisee-web
  namespace: omnisee
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: web }
