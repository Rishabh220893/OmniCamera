# The media server (MediaMTX): one pull per camera, many viewers (media-server/). Recordings (Profile 1) are written to its volume. Its configuration is
# generated by the app (scripts/media-config.ts / the Registry apply) and mounted as mediamtx.yml; here a minimal one is created so the pod starts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: omnisee-mediamtx
  namespace: omnisee
  labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: mediamtx, app.kubernetes.io/part-of: omnisee }
spec:
  serviceName: omnisee-mediamtx
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: mediamtx }
  template:
    metadata:
      labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: mediamtx, app.kubernetes.io/part-of: omnisee }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.9.3
          ports:
            - { name: rtsp, containerPort: 8554 }
            - { name: hls, containerPort: 8888 }
            - { name: webrtc, containerPort: 8889 }
            - { name: webrtc-udp, containerPort: 8189, protocol: UDP }
            - { name: api, containerPort: 9997 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "4", memory: 4Gi }
          readinessProbe: { tcpSocket: { port: hls }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: hls }, periodSeconds: 15, failureThreshold: 4 }
          volumeMounts:
            - { name: recordings, mountPath: /recordings }
            - { name: config, mountPath: /mediamtx.yml, subPath: mediamtx.yml }
      volumes:
        - name: config
          configMap: { name: omnisee-mediamtx-config }
  volumeClaimTemplates:
    - metadata: { name: recordings }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 500Gi } }   # size from docs/load-test-report.md: bitrate x cameras x days
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: omnisee-mediamtx-config
  namespace: omnisee
data:
  mediamtx.yml: |
    logLevel: info
    api: yes
    apiAddress: :9997
    rtsp: yes
    rtspAddress: :8554
    hls: yes
    hlsAddress: :8888
    webrtc: yes
    webrtcAddress: :8889
    webrtcLocalUDPAddress: :8189
    paths:
      all_others:
---
apiVersion: v1
kind: Service
metadata:
  name: omnisee-mediamtx
  namespace: omnisee
  labels: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: mediamtx }
spec:
  selector: { app.kubernetes.io/name: omnisee, app.kubernetes.io/component: mediamtx }
  ports:
    - { name: rtsp, port: 8554, targetPort: rtsp }
    - { name: hls, port: 8888, targetPort: hls }
    - { name: webrtc, port: 8889, targetPort: webrtc }
    - { name: api, port: 9997, targetPort: api }
