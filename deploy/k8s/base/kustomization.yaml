apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omnisee
resources:
  - namespace.yaml
  - config.yaml
  - web.yaml
  - analysis.yaml
  - redis.yaml
  - mediamtx.yaml
  - ingress.yaml
  - networkpolicies.yaml
# Set the image you built (docker build -t <registry>/omnisee:<tag> . && docker push ...):
#   kustomize edit set image omnisee-app=<registry>/omnisee:<tag>
images:
  - name: omnisee-app
    newName: registry.example.org/omnisee
    newTag: "1.0.0"
